name: Auto Update Logistics Dashboard

on:
  schedule:
    # UTC 기준 00:00(한국/일본 09:00), 09:00(한국/일본 18:00)
    - cron: '0 0,9 * * *'
  workflow_dispatch: # 관리자가 필요할 때 수동으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: pip install pytz

      - name: 스크립트 실행 (환율/데이터 갱신)
        run: python update_data.py

      - name: 변경 내용 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data [$(date '+%Y-%m-%d %H:%M')]" && git push)
